<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Luxury Obsidian Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#18181b" />
      <stop offset="100%" stopColor="#09090b" />
    </radialGradient>

    <!-- Warm Champagne Gold Metallic Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="25%" stopColor="#e6c367" />
      <stop offset="50%" stopColor="#d4af37" />
      <stop offset="75%" stopColor="#b8860b" />
      <stop offset="100%" stopColor="#855800" />
    </linearGradient>

    <!-- Accent Gold Stroke -->
    <linearGradient id="goldStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#d4af37" />
      <stop offset="50%" stopColor="#fef08a" />
      <stop offset="100%" stopColor="#996515" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="40" fill="url(#bgGlow)" />
  <rect width="496" height="496" x="2" y="2" rx="38" fill="none" stroke="url(#goldStroke)" stroke-width="1.5" opacity="0.4" />

  <!-- Outer Geometric Diamond Framing -->
  <g transform="translate(250, 195)">
    <!-- Rotating subtle luxury diamond ring -->
    <polygon points="0,-125 125,0 0,125 -125,0" fill="none" stroke="url(#goldStroke)" stroke-width="1" opacity="0.35" />
    <polygon points="0,-115 115,0 0,115 -115,0" fill="none" stroke="url(#goldStroke)" stroke-width="0.75" opacity="0.2" />

    <!-- Center Icon: Monogram Bespoke "V" & Needle Tailoring Wings -->
    <!-- Left Wing of V -->
    <path d="M-65 -80 L-20 60 L0 60 L-35 -80 Z" fill="url(#goldMetallic)" filter="url(#goldGlow)" />
    
    <!-- Right Wing of V with Overlapping Geometric Fold -->
    <path d="M65 -80 L20 60 L0 60 L35 -80 Z" fill="url(#goldMetallic)" opacity="0.9" />

    <!-- Precision Needle & Thread Center Intersection -->
    <path d="M0 -95 L0 80" stroke="url(#goldMetallic)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="-90" r="3" fill="#ffffff" />
    <circle cx="0" cy="80" r="2" fill="#d4af37" />

    <!-- Chevron Fold Accent -->
    <polygon points="0,20 -25,-40 0,-25 25,-40" fill="url(#goldMetallic)" opacity="0.7" />
  </g>

  <!-- Typography: VEYRA -->
  <text
    x="250"
    y="380"
    text-anchor="middle"
    font-family="'Cinzel', 'Playfair Display', 'Didot', 'Trajan Pro', serif"
    font-size="44"
    font-weight="700"
    letter-spacing="14"
    fill="url(#goldMetallic)"
  >
    VEYRA
  </text>

  <!-- Subtitle: NIGERIA -->
  <text
    x="250"
    y="415"
    text-anchor="middle"
    font-family="'Cinzel', 'Montserrat', 'Inter', sans-serif"
    font-size="12"
    font-weight="600"
    letter-spacing="8"
    fill="#a1a1aa"
  >
    NIGERIA · HAUTE COUTURE
  </text>

  <!-- Small Tailoring Star Accent -->
  <polygon points="250,432 252,437 257,437 253,440 255,445 250,442 245,445 247,440 243,437 248,437" fill="#d4af37" opacity="0.8" />
</svg>
